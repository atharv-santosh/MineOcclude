plugins {
    // Loom 1.4 is the last comfortable line for 1.16.5. Build with JDK 17;
    // the produced mod targets Java 8 bytecode (MC 1.16.5 runs on Java 8/11).
    id 'fabric-loom' version '1.4.6'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral() // JUnit for the pure-Java unit tests
}

def c1ServerRunDir = providers.gradleProperty('mineoccludeServerRunDir')
        .getOrElse('C:/Users/lollo/MineOcclude-Runtime/person-c-c1-v0_1/server')
def c1ClientRunDir = providers.gradleProperty('mineoccludeClientRunDir')
        .getOrElse('C:/Users/lollo/MineOcclude-Runtime/person-c-c1-v0_1/client')

loom {
    runs {
        mineoccludeServer {
            server()
            name 'MineOcclude Dedicated Server'
            runDir c1ServerRunDir
            vmArgs '-Xms1G', '-Xmx2G', '-Dfile.encoding=UTF-8'
            programArg 'nogui'
            ideConfigGenerated false
        }
        mineoccludeClient {
            client()
            name 'MineOcclude Production Client'
            runDir c1ClientRunDir
            vmArgs '-Xms1G', '-Xmx2G', '-Dfile.encoding=UTF-8'
            programArgs '--width', '640', '--height', '360'
            ideConfigGenerated false
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Pure-Java unit tests (lifecycle, noise schedule, geometry) — no
    // Minecraft runtime needed. Gson matches the version MC 1.16.5 bundles.
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.8.0'
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // MC 1.16.5 runs on Java 8.
    it.options.release = 8
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
